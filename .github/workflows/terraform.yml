name: terraform

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TERRAFORM_VERSION: 1.9.8

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - homolog
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  deploy:
    name: Deploy Terraform
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'develop' && 'homolog' || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Select environment variables
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "ENV_DIR=terraform/environments/homolog" >> "$GITHUB_ENV"
            echo "BACKEND_KEY=autoservice-infra-db/homolog.tfstate" >> "$GITHUB_ENV"
            echo "TF_VAR_db_password=${{ secrets.TF_VAR_DB_PASSWORD_HOMOLOG }}" >> "$GITHUB_ENV"
            {
              echo 'TF_VARS_CONTENT<<EOF'
              echo '${{ secrets.TF_VARS_HOMOLOG }}'
              echo 'EOF'
            } >> "$GITHUB_ENV"
          else
            echo "ENV_DIR=terraform/environments/prod" >> "$GITHUB_ENV"
            echo "BACKEND_KEY=autoservice-infra-db/prod.tfstate" >> "$GITHUB_ENV"
            echo "TF_VAR_db_password=${{ secrets.TF_VAR_DB_PASSWORD_PROD }}" >> "$GITHUB_ENV"
            {
              echo 'TF_VARS_CONTENT<<EOF'
              echo '${{ secrets.TF_VARS_PROD }}'
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: Create tfvars file
        shell: bash
        run: |
          printf '%s\n' "${TF_VARS_CONTENT}" > "${ENV_DIR}/terraform.tfvars"

      - name: Terraform init
        working-directory: ${{ env.ENV_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${BACKEND_KEY}" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        working-directory: ${{ env.ENV_DIR }}
        run: terraform plan -var-file="terraform.tfvars"

      - name: Terraform apply
        working-directory: ${{ env.ENV_DIR }}
        run: terraform apply -auto-approve -var-file="terraform.tfvars"