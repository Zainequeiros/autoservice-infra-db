# CI/CD Terraform — autoservice-infra-db
# Padrão: develop → homolog | main → prod
# PR / push: validate (homolog + prod) — só checagem, não aplica
# Push: apply somente do ambiente da branch

name: CI/CD Terraform

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: infra-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TERRAFORM_VERSION: "1.9.8"

jobs:
  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [homolog, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  deploy:
    name: Deploy (${{ github.ref_name == 'develop' && 'homolog' || 'prod' }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'develop' && 'homolog' || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Select environment variables
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "ENV_DIR=terraform/environments/homolog" >> "$GITHUB_ENV"
            echo "BACKEND_KEY=autoservice-infra-db/homolog.tfstate" >> "$GITHUB_ENV"
            echo "TF_VAR_db_password=${{ secrets.TF_VAR_DB_PASSWORD_HOMOLOG }}" >> "$GITHUB_ENV"
            {
              echo 'TF_VARS_CONTENT<<EOF'
              echo '${{ secrets.TF_VARS_HOMOLOG }}'
              echo 'EOF'
            } >> "$GITHUB_ENV"
          else
            echo "ENV_DIR=terraform/environments/prod" >> "$GITHUB_ENV"
            echo "BACKEND_KEY=autoservice-infra-db/prod.tfstate" >> "$GITHUB_ENV"
            echo "TF_VAR_db_password=${{ secrets.TF_VAR_DB_PASSWORD_PROD }}" >> "$GITHUB_ENV"
            {
              echo 'TF_VARS_CONTENT<<EOF'
              echo '${{ secrets.TF_VARS_PROD }}'
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: Create tfvars file
        shell: bash
        run: |
          printf '%s\n' "${TF_VARS_CONTENT}" > "${ENV_DIR}/terraform.tfvars"

      - name: Terraform init
        working-directory: ${{ env.ENV_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${BACKEND_KEY}" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        working-directory: ${{ env.ENV_DIR }}
        run: terraform plan -lock=false -var-file="terraform.tfvars"

      # Academy: homolog/prod podem compartilhar nomes de recurso. Se o state
      # estiver vazio e o recurso já existir, importa e reaplica (não recria).
      - name: Terraform apply (adopt existing if needed)
        working-directory: ${{ env.ENV_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if terraform apply -auto-approve -lock=false -var-file="terraform.tfvars"; then
            echo "Apply OK"
            exit 0
          fi

          echo "Apply falhou — adotando recursos já existentes no state (se ainda não estiverem)..."

          if ! terraform state list | grep -q 'module.managed_postgres.aws_security_group.db'; then
            SG_ID="$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=autoservice-db-db-sg" \
              --query 'SecurityGroups[0].GroupId' --output text)"
            test -n "${SG_ID}" && test "${SG_ID}" != "None"
            terraform import -lock=false -var-file="terraform.tfvars" \
              'module.managed_postgres.aws_security_group.db' "${SG_ID}"
          fi

          if ! terraform state list | grep -q 'module.managed_postgres.aws_db_subnet_group.this'; then
            terraform import -lock=false -var-file="terraform.tfvars" \
              'module.managed_postgres.aws_db_subnet_group.this' autoservice-db-subnet-group
          fi

          if ! terraform state list | grep -q 'module.managed_postgres.aws_db_parameter_group.this'; then
            terraform import -lock=false -var-file="terraform.tfvars" \
              'module.managed_postgres.aws_db_parameter_group.this' autoservice-db-postgres17
          fi

          if ! terraform state list | grep -q 'module.managed_postgres.aws_db_instance.this'; then
            terraform import -lock=false -var-file="terraform.tfvars" \
              'module.managed_postgres.aws_db_instance.this' autoservice-db
          fi

          terraform apply -auto-approve -lock=false -var-file="terraform.tfvars"
