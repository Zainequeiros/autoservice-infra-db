name: terraform

on:
  pull_request:
    branches:
      - main
      - master
      - homolog
  push:
    branches:
      - main
      - master
      - homolog

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TERRAFORM_VERSION: 1.9.8
  WORKING_DIRECTORY: terraform

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform validate

  deploy:
    name: Deploy Terraform
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'homolog' && 'homolog' || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Select environment variables
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "homolog" ]; then
            echo "TF_VARS_FILE=environments/homolog/terraform.tfvars" >> "$GITHUB_ENV"
            echo "TF_VAR_db_password=${{ secrets.TF_VAR_db_password_homolog }}" >> "$GITHUB_ENV"
          else
            echo "TF_VARS_FILE=environments/prod/terraform.tfvars" >> "$GITHUB_ENV"
            echo "TF_VAR_db_password=${{ secrets.TF_VAR_db_password_prod }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init

      - name: Terraform plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform plan -var-file="${TF_VARS_FILE}"

      - name: Terraform apply
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform apply -auto-approve -var-file="${TF_VARS_FILE}"

